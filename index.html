<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waiza's Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one centered stage in black and gold. A gift is opened, black and gold balloons rise, confetti falls, then a pop-up card with a cake to blow out. Single look by choice. */
:root {
  --bg: #0b0b0d;
  --bg2: #1a1608;
  --card: #141210;
  --gold: #d4af37;
  --gold-hi: #f3d97a;
  --gold-lo: #8a6d1b;
  --text: #f4ecd8;
  --muted: #a89d82;
  --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --body: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(110% 70% at 50% 0%, var(--bg2), var(--bg) 65%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  font-weight: 300;
  line-height: 1.65;
  overflow-x: hidden;
}
.wrap {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { width: 100%; max-width: 460px; text-align: center; }

/* ---------- Gift screen ---------- */
.eyebrow {
  font-family: var(--body);
  font-weight: 400;
  letter-spacing: .32em;
  text-transform: uppercase;
  font-size: .75rem;
  color: var(--gold);
  margin: 0 0 10px;
}
.big-name {
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(3.2rem, 17vw, 5.2rem);
  line-height: 1.05;
  margin: 0 0 30px;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.gift {
  position: relative;
  width: 190px;
  height: 190px;
  margin: 0 auto 32px;
  cursor: pointer;
  animation: sway 3.4s ease-in-out infinite;
  transform-origin: 50% 100%;
}
.gift .box {
  position: absolute; left: 14px; right: 14px; bottom: 0; height: 118px;
  background: linear-gradient(160deg, #26231d, #0e0d0b);
  border: 1px solid var(--gold-lo);
  border-radius: 4px;
}
.gift .ribbon-v {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 26px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi) 50%, var(--gold-lo));
}
.gift .lid {
  position: absolute; left: 0; right: 0; bottom: 108px; height: 42px;
  background: linear-gradient(160deg, #2c2922, #0e0d0b);
  border: 1px solid var(--gold-lo);
  border-radius: 4px;
  transition: transform .6s cubic-bezier(.3, 1.4, .5, 1);
  transform-origin: 0 100%;
}
.gift .lid .ribbon-v { height: 100%; }
.gift .bow {
  position: absolute; top: -28px; width: 38px; height: 38px;
  border: 7px solid var(--gold); border-radius: 50% 50% 50% 4px;
}
.gift .bow.l { left: calc(50% - 40px); transform: rotate(-8deg); }
.gift .bow.r { left: calc(50% + 2px); transform: scaleX(-1) rotate(-8deg); }
.gift.open { animation: none; }
.gift.open .lid { transform: translate(18px, -54px) rotate(-22deg); }
.gift.open .box { animation: pop .4s ease-out; }

.btn {
  font-family: var(--body);
  font-weight: 500;
  font-size: .85rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #1a1405;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo));
  border: 0;
  border-radius: 2px;
  padding: 15px 34px;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .cake-btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 4px; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.alt { background: transparent; color: var(--gold); border: 1px solid var(--gold); }

/* ---------- Card pop-up ---------- */
.card {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--gold-lo);
  border-radius: 4px;
  padding: 36px 24px 32px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 6px rgba(212,175,55,.06), inset 0 0 0 5px var(--card), inset 0 0 0 6px rgba(212,175,55,.35);
  animation: cardpop .7s cubic-bezier(.2, 1.3, .4, 1) both;
}
.card h2 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(1.9rem, 8vw, 2.5rem);
  line-height: 1.15;
  margin: 0 0 8px;
  text-wrap: balance;
}
.card h2 .name { font-style: italic; color: var(--gold-hi); }
.card .sub { color: var(--muted); margin: 0 0 6px; }
.cake-btn {
  display: block; margin: 0 auto; padding: 0; border: 0; background: none;
  width: min(100%, 250px); cursor: pointer; border-radius: 8px;
}
.cake-btn svg { display: block; width: 100%; height: auto; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; transition: opacity .3s, transform .3s; }
.flame:nth-of-type(2) { animation-delay: .15s; }
.flame:nth-of-type(3) { animation-delay: .3s; }
.out .flame { opacity: 0; transform: scale(.2); animation: none; }
.hint { font-size: .85rem; letter-spacing: .08em; color: var(--gold); margin: 6px 0 20px; min-height: 1.4em; }
.rule { width: 48px; height: 1px; background: var(--gold-lo); margin: 0 auto 20px; border: 0; }
.message { font-size: 1.05rem; margin: 0 0 28px; text-wrap: pretty; color: var(--text); }
.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ---------- Balloons + confetti ---------- */
#sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.balloon {
  position: absolute; bottom: -130px; width: 52px; height: 66px;
  border-radius: 50% 50% 48% 48%;
  animation: rise var(--dur) ease-in var(--delay) forwards;
}
.balloon.black { background: radial-gradient(circle at 32% 28%, #5a5a60 0, #1b1b1f 28%, #050506 75%); box-shadow: inset -4px -6px 10px rgba(0,0,0,.6); }
.balloon.gold { background: radial-gradient(circle at 32% 28%, #fff1a8 0, #e0b93f 30%, #8a6d1b 85%); box-shadow: inset -4px -6px 10px rgba(80,55,0,.5); }
.balloon::after {
  content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 46px;
  background: rgba(244,236,216,.5);
}
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes cardpop { 0% { opacity: 0; transform: translateY(40px) scale(.7); } 100% { opacity: 1; transform: none; } }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.92, 1.08) rotate(3deg); } }
@keyframes rise {
  0% { transform: translate(0, 0); }
  50% { transform: translate(var(--sway), -70vh); }
  100% { transform: translate(0, -135vh); }
}
@media (prefers-reduced-motion: reduce) {
  .gift, .flame { animation: none; }
  .card { animation: none; }
  .balloon { animation-duration: 0.01s; animation-delay: 0s; opacity: 0; }
  .gift .lid { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <main class="stage">
    <section id="gift-screen">
      <p class="eyebrow">A surprise for</p>
      <h1 class="big-name">Waiza</h1>
      <div class="gift" id="gift" aria-hidden="true">
        <div class="box"><div class="ribbon-v"></div></div>
        <div class="lid"><div class="ribbon-v"></div><div class="bow l"></div><div class="bow r"></div></div>
      </div>
      <button class="btn" id="open-btn" type="button">Open your gift</button>
    </section>

    <section class="card" id="card" role="region" aria-labelledby="title" hidden>
      <h2 id="title">Happy Birthday, <span class="name">Waiza</span></h2>
      <p class="sub">Make a wish, then blow out the candles.</p>
      <button class="cake-btn" id="cake-btn" type="button" aria-label="Blow out the candles">
        <svg id="cake" viewBox="0 0 240 200" role="img" aria-hidden="true">
          <ellipse cx="120" cy="180" rx="104" ry="11" fill="#2a2418"/>
          <rect x="40" y="120" width="160" height="56" rx="6" fill="#1c1a17" stroke="#d4af37" stroke-width="1.5"/>
          <path d="M40 130 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V120 H40Z" fill="#d4af37"/>
          <rect x="40" y="160" width="160" height="4" fill="#d4af37" opacity=".55"/>
          <rect x="66" y="84" width="108" height="42" rx="6" fill="#d4af37"/>
          <path d="M66 94 q9 12 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 V84 H66Z" fill="#1c1a17"/>
          <rect x="92" y="54" width="8" height="32" rx="2" fill="#f4ecd8"/>
          <rect x="116" y="54" width="8" height="32" rx="2" fill="#f4ecd8"/>
          <rect x="140" y="54" width="8" height="32" rx="2" fill="#f4ecd8"/>
          <g class="flame"><ellipse cx="96" cy="42" rx="6" ry="11" fill="#ffb02e"/><ellipse cx="96" cy="45" rx="3" ry="6" fill="#fff3b0"/></g>
          <g class="flame"><ellipse cx="120" cy="42" rx="6" ry="11" fill="#ffb02e"/><ellipse cx="120" cy="45" rx="3" ry="6" fill="#fff3b0"/></g>
          <g class="flame"><ellipse cx="144" cy="42" rx="6" ry="11" fill="#ffb02e"/><ellipse cx="144" cy="45" rx="3" ry="6" fill="#fff3b0"/></g>
        </svg>
      </button>
      <p class="hint" id="hint" aria-live="polite">Tap the cake to blow out the candles</p>
      <hr class="rule">
      <p class="message">Another year, another reason to celebrate you. Wishing you a day full of laughter, good food and everything you have been hoping for. May this year be your best one yet.</p>
      <div class="actions">
        <button class="btn" id="party-btn" type="button">More confetti</button>
        <button class="btn alt" id="relight-btn" type="button" hidden>Light the candles again</button>
      </div>
    </section>
  </main>
</div>

<div id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#d4af37', '#f3d97a', '#8a6d1b', '#f4ecd8', '#2a2a2e', '#d4af37'];

  /* ---------- Confetti ---------- */
  var cv = $('confetti'), ctx = cv.getContext('2d'), parts = [], running = false, dpr = 1;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(window.innerWidth * dpr);
    cv.height = Math.round(window.innerHeight * dpr);
  }
  size();
  window.addEventListener('resize', size);

  function burst(x, y, n) {
    if (reduce) n = Math.round(n / 4);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
        r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
        c: colors[(Math.random() * colors.length) | 0],
        life: 110 + Math.random() * 70
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += .28; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      if (p.life <= 0 || p.y > window.innerHeight + 30) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x * dpr, p.y * dpr);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w * dpr / 2, -p.h * dpr / 2, p.w * dpr, p.h * dpr);
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }

  /* ---------- Balloons: black and gold ---------- */
  function balloons(n) {
    var sky = $('sky');
    for (var i = 0; i < n; i++) {
      var b = document.createElement('div');
      b.className = 'balloon ' + (i % 2 ? 'gold' : 'black');
      b.style.left = (4 + Math.random() * 88) + '%';
      b.style.setProperty('--dur', (5 + Math.random() * 4) + 's');
      b.style.setProperty('--delay', (Math.random() * 1.2) + 's');
      b.style.setProperty('--sway', ((Math.random() - .5) * 80) + 'px');
      sky.appendChild(b);
    }
    setTimeout(function () { sky.innerHTML = ''; }, 11000);
  }

  /* ---------- Sound (starts only after a tap) ---------- */
  function chime() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var a = new AC();
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.11;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + 0.75);
      });
    } catch (e) {}
  }

  /* ---------- Open the gift ---------- */
  var opened = false;
  function openGift() {
    if (opened) return;
    opened = true;
    $('gift').classList.add('open');
    $('open-btn').disabled = true;
    chime();
    var r = $('gift').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 30, 90);
    balloons(14);
    setTimeout(function () {
      $('gift-screen').hidden = true;
      $('card').hidden = false;
      burst(window.innerWidth * .2, window.innerHeight * .75, 60);
      burst(window.innerWidth * .8, window.innerHeight * .75, 60);
    }, 900);
  }
  $('open-btn').addEventListener('click', openGift);
  $('gift').addEventListener('click', openGift);

  /* ---------- Blow out the candles ---------- */
  var lit = true;
  function blow() {
    if (!lit) return;
    lit = false;
    $('cake').classList.add('out');
    $('hint').textContent = 'Wish made. Now go enjoy your day, Waiza.';
    $('relight-btn').hidden = false;
    var r = $('cake').getBoundingClientRect();
    setTimeout(function () { burst(r.left + r.width / 2, r.top + 30, 110); }, 350);
  }
  $('cake-btn').addEventListener('click', blow);
  $('relight-btn').addEventListener('click', function () {
    lit = true;
    $('cake').classList.remove('out');
    $('hint').textContent = 'Tap the cake to blow out the candles';
    this.hidden = true;
  });
  $('party-btn').addEventListener('click', function () {
    var r = this.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 80);
    balloons(8);
    chime();
  });
})();
</script>

</body>
</html>
